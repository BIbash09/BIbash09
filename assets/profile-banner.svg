<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bibash Gautam</title>
  <desc id="desc">Data Analytics, Business Intelligence, and Business Analysis</desc>
  <defs>
    <linearGradient id="background" x1="36" y1="22" x2="1162" y2="307" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07152F"/>
      <stop offset="0.48" stop-color="#123D78"/>
      <stop offset="1" stop-color="#5B21B6"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(945 64) rotate(139) scale(405 330)">
      <stop stop-color="#38BDF8" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
